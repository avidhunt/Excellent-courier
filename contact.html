<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Excellent Courier</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white p-6">
  <h1 class="text-3xl font-bold text-yellow-500 mb-6">Contact Us</h1>
  <p class="mb-4">We’re always here to help. Reach us via the form below or email.</p>

  <form class="space-y-4 max-w-lg">
    <input type="text" placeholder="Your Name" class="w-full p-2 rounded text-black" required>
    <input type="email" placeholder="Your Email" class="w-full p-2 rounded text-black" required>
    <textarea placeholder="Your Message" class="w-full p-2 rounded text-black" rows="4" required></textarea>
    <button class="bg-yellow-500 text-black px-6 py-2 rounded hover:bg-yellow-400">Send Message</button>
  </form>

  <p class="mt-6">📧 support@excellentcourier.com</p>
  <p>📞 +1 (800) 555-2025</p>
</body>
</html>
