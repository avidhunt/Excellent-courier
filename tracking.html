<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Package | Excellent Courier</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="js/tracking.js" defer></script>
</head>
<body class="bg-black text-white p-6">
  <h1 class="text-3xl font-bold text-yellow-500 mb-6">Track Your Package</h1>

  <form id="trackForm" class="space-y-4 max-w-lg">
    <input type="text" id="trackInput" placeholder="Enter Tracking Number" class="w-full p-2 rounded text-black" required>
    <button type="submit" class="bg-yellow-500 text-black px-6 py-2 rounded hover:bg-yellow-400">Track</button>
  </form>

  <div id="result" class="mt-6 hidden">
    <h2 class="text-xl mb-2 text-yellow-400">Package Status:</h2>
    <div class="w-full bg-gray-700 rounded-full h-4">
      <div id="progress" class="bg-yellow-500 h-4 rounded-full transition-all duration-1000" style="width: 0%;"></div>
    </div>
    <p id="statusText" class="mt-3"></p>
  </div>
</body>
</html>
